<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <radialGradient id="cyanGlow" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="85%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.8; r: 4.5; }
      50% { opacity: 0.3; r: 7.5; }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.4; }
      100% { transform: translateY(270px); opacity: 0.2; }
    }
    .status-pulse {
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
    .f-mono {
      font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', 'Cascadia Code', Consolas, monospace;
    }
    .f-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>

  <!-- Card Background -->
  <rect x="2" y="2" width="876" height="276" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  
  <!-- Cyber Grid -->
  <rect x="2" y="2" width="876" height="276" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Spots -->
  <rect x="2" y="2" width="876" height="276" rx="16" fill="url(#cyanGlow)" />
  <rect x="2" y="2" width="876" height="276" rx="16" fill="url(#purpleGlow)" />

  <!-- Terminal Header Bar -->
  <path d="M 2 18 Q 2 2 18 2 L 862 2 Q 878 2 878 18 L 878 38 L 2 38 Z" fill="#0f172a" fill-opacity="0.85" />
  <line x1="2" y1="38" x2="878" y2="38" stroke="#1e293b" stroke-width="1" />

  <!-- Mac Window Dots -->
  <circle cx="22" cy="20" r="5.5" fill="#ef4444" />
  <circle cx="38" cy="20" r="5.5" fill="#f59e0b" />
  <circle cx="54" cy="20" r="5.5" fill="#10b981" />

  <!-- Terminal Window Title -->
  <text x="80" y="24" class="f-mono" font-size="12" fill="#64748b" font-weight="500">
    suraj@platform-node-01: ~/infrastructure (main)
  </text>

  <!-- Live Status Chip in Title Bar -->
  <g transform="translate(680, 11)">
    <rect width="180" height="20" rx="10" fill="#132337" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="12" cy="10" r="4" fill="#10b981" />
    <circle cx="12" cy="10" r="6" fill="#10b981" class="status-pulse" opacity="0.5" />
    <text x="24" y="14" class="f-mono" font-size="10.5" fill="#38bdf8" font-weight="600">SYSTEM: ACTIVE • 99.9%</text>
  </g>

  <!-- Main Content Layout -->
  <!-- Left Side: Name and Identity -->
  <g transform="translate(42, 75)">
    <!-- Role Pre-title -->
    <text x="0" y="0" class="f-mono" font-size="12" fill="#38bdf8" font-weight="600" letter-spacing="2">
      // SENIOR DEVOPS &amp; CLOUD ARCHITECT
    </text>

    <!-- Main Name -->
    <text x="0" y="42" class="f-sans" font-size="38" fill="url(#textGrad)" font-weight="800" letter-spacing="-0.5">
      SURAJ SINGH THAKUR
    </text>

    <!-- Subtitle / Bio Statement -->
    <text x="0" y="70" class="f-sans" font-size="15" fill="#94a3b8" font-weight="400">
      Multi-Cloud Engineering • Kubernetes &amp; DevSecOps • Infrastructure as Code • Enterprise CI/CD
    </text>

    <!-- Tech Badges Pill Row -->
    <g transform="translate(0, 92)">
      <!-- Badge 1: AWS -->
      <rect x="0" y="0" width="82" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="41" y="16" class="f-mono" font-size="11" fill="#f59e0b" font-weight="600" text-anchor="middle">☁️ AWS</text>

      <!-- Badge 2: Azure -->
      <rect x="90" y="0" width="88" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="134" y="16" class="f-mono" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="middle">⚡ Azure</text>

      <!-- Badge 3: GCP -->
      <rect x="186" y="0" width="82" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="227" y="16" class="f-mono" font-size="11" fill="#60a5fa" font-weight="600" text-anchor="middle">🌐 GCP</text>

      <!-- Badge 4: Kubernetes -->
      <rect x="276" y="0" width="118" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="335" y="16" class="f-mono" font-size="11" fill="#818cf8" font-weight="600" text-anchor="middle">☸️ Kubernetes</text>

      <!-- Badge 5: Terraform -->
      <rect x="402" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="454" y="16" class="f-mono" font-size="11" fill="#c084fc" font-weight="600" text-anchor="middle">⚙️ Terraform</text>

      <!-- Badge 6: DevSecOps -->
      <rect x="515" y="0" width="110" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="570" y="16" class="f-mono" font-size="11" fill="#34d399" font-weight="600" text-anchor="middle">🛡️ DevSecOps</text>
    </g>

    <!-- Terminal Command Execution Simulation -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="796" height="48" rx="8" fill="#030712" fill-opacity="0.8" stroke="#1f2937" stroke-width="1" />
      
      <!-- Command prompt -->
      <text x="16" y="21" class="f-mono" font-size="12" fill="#34d399" font-weight="600">$</text>
      <text x="32" y="21" class="f-mono" font-size="12" fill="#f8fafc">terraform apply</text>
      <text x="145" y="21" class="f-mono" font-size="12" fill="#38bdf8">-var=&quot;env=production&quot;</text>
      <text x="305" y="21" class="f-mono" font-size="12" fill="#94a3b8">-auto-approve</text>

      <text x="16" y="38" class="f-mono" font-size="11" fill="#10b981">✔ Apply complete! Resources: 14 added, 0 changed, 0 destroyed. [Multi-Cloud Mesh Online]</text>
    </g>
  </g>
</svg>
